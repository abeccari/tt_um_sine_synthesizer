[project]
name = "tt-um-abeccari-swsynth"
version = "0.1.0"
description = "Dependencies for the Sine Wave Synthesizer TinyTapeout project"
authors = [{ name = "Alberto Beccari" }]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pytest==8.4.2",
    "cocotb==2.0.1",
    "numpy>=2.0",
]

# matplotlib is only needed for local waveform plots (run tests with SW_PLOT=1).
# It's an optional extra so CI stays lean. Install locally: uv sync --extra plot
[project.optional-dependencies]
plot = ["matplotlib>=3.10.9"]

[tool.uv]
# Keep test/requirements.txt in sync after changing deps or the lockfile:
#   uv export --no-hyphens --no-emit-project --no-hashes -o test/requirements.txt

[tool.pytest.ini_options]
testpaths = ["test"]
